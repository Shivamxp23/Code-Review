description = "Quick reference for reviewer-lazy levels, skills, and commands"
prompt = "Show the reviewer-lazy quick reference. One shot, change nothing: do not switch mode, write flag files, or persist anything. Levels: /reviewer-lazy lite (build what's asked, name the lazier alternative in one line), /reviewer-lazy (full, the default ladder: YAGNI then stdlib then native then one line then minimum), /reviewer-lazy ultra (deletion before addition, challenges the requirement before building). Commands: /reviewer-lazy-review (over-engineering review of the current changes), /reviewer-lazy-audit (whole-repo over-engineering audit), /reviewer-lazy-debt (harvest reviewer-lazy: comments into a tracked ledger), /reviewer-lazy-gain (measured-impact scoreboard from the benchmark), /reviewer-lazy-help (this card). Deactivate with 'stop reviewer-lazy', 'normal mode', or /reviewer-lazy off; resume anytime with /reviewer-lazy. Default mode is full; change it with the reviewer-lazy_DEFAULT_MODE environment variable (off|lite|full|ultra) or a config file at ~/.config/reviewer-lazy/config.json (Windows: %APPDATA%\\reviewer-lazy\\config.json) with {\"defaultMode\": \"lite\"}. Resolution order: env var, then config file, then full."
